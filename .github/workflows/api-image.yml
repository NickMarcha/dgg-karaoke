# Builds the API image and publishes it to GitHub's registry. The server runs this image and
# redeploys when the tag moves (docs/deployment.md), so it never clones this repository, whose
# history is upstream's 2.5 GB.
name: API image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/nickmarcha/dgg-karaoke-api:main
            ghcr.io/nickmarcha/dgg-karaoke-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
